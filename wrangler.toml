name = "dukabee"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"

# Static site (landing, launch flow, stores, demos) is built into dist/ by `npm run build`.
# The Worker runs first so seller subdomains (worker/index.mjs STORE_HOSTS) can be mapped onto their store folder;
# everything else falls straight through to the assets.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# Leads captured by the "I want this store" form. SQLite-backed Durable Object: no database to
# create by hand, and it deploys with the normal `wrangler deploy`.
[[durable_objects.bindings]]
name = "LEADS"
class_name = "Leads"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Leads"]

# To read leads at /admin/, set a secret once:  npx wrangler secret put ADMIN_KEY
